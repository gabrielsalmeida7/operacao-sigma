[package]
name = "operacao-sigma"
version = "1.0.0"
description = "Operação Sigma - Sistema gamificado de estudos"
authors = ["Gabriel"]
edition = "2021"

[lib]
name = "operacao_sigma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
